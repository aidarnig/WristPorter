name: Implementation / investigation task
description: One small, independently verifiable work item; read AGENTS.md first.
title: "[Task] "
body:
  - type: markdown
    attributes:
      value: |
        Executor starts from this Issue only. Read AGENTS.md, then task-relevant docs. No device identifiers, pairing codes or private photo/message data. Use one branch per executor.
  - type: dropdown
    id: execution_status
    attributes:
      label: Execution status
      description: READY only when dependency and hardware prerequisites are available.
      options:
        - READY
        - BLOCKED
        - IN PROGRESS
        - NEEDS DEVICE TEST
    validations:
      required: true
  - type: input
    id: parent
    attributes:
      label: Parent milestone / upstream Issue
      placeholder: "#28; none for an independent task"
    validations:
      required: false
  - type: textarea
    id: outcome
    attributes:
      label: Observable result and non-goals
      description: One testable outcome, exact scope and exclusions, no duplicated spec.
    validations:
      required: true
  - type: textarea
    id: dependencies
    attributes:
      label: Dependencies / owned files / relevant docs
      description: List Issues which must land first and any shared interface owner.
    validations:
      required: true
  - type: textarea
    id: tests
    attributes:
      label: Acceptance and owner-assisted device checkpoint
      description: Automated tests plus exact watch/iPhone/Windows test if applicable; mark not applicable otherwise.
    validations:
      required: true
  - type: textarea
    id: risk
    attributes:
      label: Risk and rollback
      description: Security/privacy/battery concerns; safe revert, or 'no new risk' with reason.
    validations:
      required: true
