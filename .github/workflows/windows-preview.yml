name: Windows preview artifact (not a release)

# Non-publishing test ZIP for in-chat Windows and watch regression checks.
# Stable releases are owned exclusively by windows-portable.yml.
on:
  pull_request:
    paths:
      - 'pom.xml'
      - 'watch-*/pom.xml'
      - 'watch-*/src/**'
      - 'ci/package-windows.ps1'
      - 'ci/bundle-adb.ps1'
      - 'ci/install-watch-test-apk.ps1'
      - '.github/workflows/windows-preview.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wristporter-windows-preview-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  preview:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Parse-check safe watch APK installer
        shell: pwsh
        run: |
          $tokens = $null
          $parseErrors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path 'ci/install-watch-test-apk.ps1').Path, [ref]$tokens, [ref]$parseErrors
          )
          if ($parseErrors.Count -gt 0) { throw ($parseErrors | Out-String) }
      - name: Verify and package portable Windows preview
        shell: pwsh
        run: ./ci/package-windows.ps1
      - name: Add test-only provenance notice
        shell: pwsh
        run: |
          @"
          WRISTPORTER PREVIEW - NOT A STABLE RELEASE
          Commit: ${{ github.sha }}
          Workflow run: ${{ github.run_id }}
          Source: pull request or explicit manual run.
          The ZIP includes experimental source at this commit, even if the internal
          application version still reflects the last stable release.
          Never redistribute or call this artifact a signed stable release.
          "@ | Set-Content -Encoding UTF8 dist/PREVIEW-READ-ME.txt
      - name: Upload preview ZIP, checksum, notice (7-day retention)
        uses: actions/upload-artifact@v4
        with:
          name: wristporter-windows-preview-${{ github.run_id }}
          path: |
            dist/WristPorter-*-windows-x64.zip
            dist/WristPorter-*-windows-x64.zip.sha256
            dist/PREVIEW-READ-ME.txt
          retention-days: 7
          if-no-files-found: error
