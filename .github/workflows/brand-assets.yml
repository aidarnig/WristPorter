name: Generate branding assets

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'docs/assets/*.svg'
      - 'ci/render-brand.py'
      - '.github/workflows/brand-assets.yml'

permissions:
  contents: write

concurrency:
  group: brand-assets-${{ github.ref }}
  cancel-in-progress: true

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install rasterization tools
        run: python -m pip install "cairosvg==2.7.1" "Pillow==11.3.0"
      - name: Render and commit reproducible artwork
        shell: bash
        run: |
          set -euo pipefail
          python ci/render-brand.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/assets/*.png docs/assets/*.ico
          if git diff --cached --quiet; then
            echo "Artwork unchanged."
            exit 0
          fi
          git commit -m "chore(assets): export brand images [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main
