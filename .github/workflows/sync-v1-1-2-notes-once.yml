name: Sync existing WristPorter 1.1.2 release notes (one-time)

# This workflow is temporary and only runs when it is first added to main.
# It only edits release text; it never uploads or changes release assets.
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/sync-v1-1-2-notes-once.yml'

permissions:
  contents: write

jobs:
  update-existing-release:
    if: github.repository == 'aidarnig/WristPorter'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Verify v1.1.2 release identity and artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/v1.1.2" > /tmp/wristporter-release-before.json
          jq -e '.id == 442029991 and .tag_name == "v1.1.2" and .draft == false and .prerelease == false' /tmp/wristporter-release-before.json >/dev/null
          jq -e '([.assets[].name] | index("WristPorter-1.1.2-windows-x64.zip")) != null and ([.assets[].name] | index("WristPorter-1.1.2-windows-x64.zip.sha256")) != null' /tmp/wristporter-release-before.json >/dev/null
          test -s docs/RELEASE_NOTES.md
      - name: Update only GitHub release description
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh release edit v1.1.2 --repo "$GITHUB_REPOSITORY" --notes-file docs/RELEASE_NOTES.md
      - name: Confirm text updated, release identity and files unchanged
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/v1.1.2" > /tmp/wristporter-release-after.json
          jq -e '.id == 442029991 and (.body | startswith("# WristPorter 1.1.2 — Photos from Windows to your Wear OS watch"))' /tmp/wristporter-release-after.json >/dev/null
          diff -u <(jq -r '[.assets[] | [.id, .name, .size]] | sort | .[] | @tsv' /tmp/wristporter-release-before.json) <(jq -r '[.assets[] | [.id, .name, .size]] | sort | .[] | @tsv' /tmp/wristporter-release-after.json)
          echo "Verified: release description updated; release ID and assets unchanged."
