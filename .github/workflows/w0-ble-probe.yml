name: W0 experimental BLE probe

on:
  pull_request:
    paths:
      - 'experiments/w0-ble-probe/**'
      - '.github/workflows/w0-ble-probe.yml'
  push:
    branches: [main]
    paths:
      - 'experiments/w0-ble-probe/**'
      - '.github/workflows/w0-ble-probe.yml'

jobs:
  android-experimental:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: experiments/w0-ble-probe
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      # GitHub ubuntu-latest includes Android SDK command line tools; setup-android@v3
      # currently fails when it requests the removed legacy sdkmanager "tools" package.
      - name: Install Android 35 platform
        run: |
          "\$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Unit tests and APK compilation (not physical Bluetooth proof)
        run: gradle --no-daemon :app:testDebugUnitTest :app:assembleDebug
