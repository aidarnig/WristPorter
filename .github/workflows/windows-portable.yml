name: WristPorter Windows portable release

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'ci/package-windows.ps1'
      - 'ci/bundle-adb.ps1'
      - '.github/workflows/windows-portable.yml'

concurrency:
  group: wristporter-portable-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-portable:
    runs-on: windows-latest
    timeout-minutes: 40
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Verify Java and build portable ZIP with bundled ADB
        shell: pwsh
        run: ./ci/package-windows.ps1
      - name: Upload ZIP and checksum for release job
        uses: actions/upload-artifact@v4
        with:
          name: WristPorter-windows-x64
          path: |
            dist/WristPorter-*-windows-x64.zip
            dist/WristPorter-*-windows-x64.zip.sha256
          retention-days: 5
          if-no-files-found: error

  publish-release:
    name: Publish verified stable ZIP to GitHub Releases
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: windows-portable
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: WristPorter-windows-x64
          path: release-files
      - name: Verify checksum and publish stable release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: v1.1.2
        shell: bash
        run: |
          set -euo pipefail
          cd release-files
          sha256sum --check WristPorter-1.1.2-windows-x64.zip.sha256
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "$RELEASE_TAG already exists. Never overwrite an existing stable release."
            exit 0
          fi
          gh release create "$RELEASE_TAG" \
            WristPorter-1.1.2-windows-x64.zip \
            WristPorter-1.1.2-windows-x64.zip.sha256 \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "WristPorter 1.1.2" \
            --notes-file "$GITHUB_WORKSPACE/docs/RELEASE_NOTES.md" \
            --latest
