name: Windows portable build (manual)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-portable:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Build and package portable application
        shell: pwsh
        run: ./ci/package-windows.ps1
      - name: Upload portable app and checksum
        uses: actions/upload-artifact@v4
        with:
          name: WatchGallerySync-windows-x64
          path: |
            dist/WatchGallerySync-windows-x64.zip
            dist/WatchGallerySync-windows-x64.zip.sha256
          retention-days: 5
