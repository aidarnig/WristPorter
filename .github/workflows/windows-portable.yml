name: WristPorter Windows portable build

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'ci/package-windows.ps1'
      - 'ci/bundle-adb.ps1'
      - '.github/workflows/windows-portable.yml'

concurrency:
  group: wristporter-portable-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-portable:
    runs-on: windows-latest
    timeout-minutes: 40
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Build portable app with bundled ADB
        shell: pwsh
        run: ./ci/package-windows.ps1
      - name: Upload portable ZIP and checksum
        uses: actions/upload-artifact@v4
        with:
          name: WristPorter-windows-x64
          path: |
            dist/WristPorter-*-windows-x64.zip
            dist/WristPorter-*-windows-x64.zip.sha256
          retention-days: 5
          if-no-files-found: error

  publish-preview:
    name: Publish test build to GitHub Releases
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: windows-portable
    permissions:
      contents: write
    steps:
      - name: Download verified Windows build
        uses: actions/download-artifact@v4
        with:
          name: WristPorter-windows-x64
          path: release-files
      - name: Verify checksum and publish prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: v0.1.0-preview.${{ github.run_number }}
        shell: bash
        run: |
          set -euo pipefail
          cd release-files
          sha256sum --check WristPorter-0.1.0-windows-x64.zip.sha256
          cat > /tmp/wristporter-preview-notes.md <<'RELEASE_NOTES'
          ## WristPorter 0.1.0 — test build

          This is an **early preview**, not a stable release. The Windows package was built and automatically tested, but its graphical launch on a clean Windows PC and photo transfer to a real Galaxy Watch 4 Classic have **not** been confirmed.

          ### Download and run

          1. Under **Assets** below, download `WristPorter-0.1.0-windows-x64.zip` (do not download GitHub's "Source code" archives).
          2. Extract the ZIP completely.
          3. Open the `WristPorter` folder and double-click `WristPorter.exe`.
          4. Enable wireless debugging on your watch; use the pairing and connection ports shown there. Add photos and transfer.

          Java and ADB (including the required DLLs) are included. No installer or Android Studio is required. A quick-start guide is inside the extracted folder.

          The `.zip.sha256` asset is the SHA-256 checksum for integrity verification. Please report issues through the project's Issues tab.
          RELEASE_NOTES
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $RELEASE_TAG already exists; skipping duplicate publication."
            exit 0
          fi
          gh release create "$RELEASE_TAG" \
            WristPorter-0.1.0-windows-x64.zip \
            WristPorter-0.1.0-windows-x64.zip.sha256 \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "WristPorter 0.1.0 Preview #$GITHUB_RUN_NUMBER" \
            --notes-file /tmp/wristporter-preview-notes.md \
            --prerelease
