name: WristPorter Windows portable build

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'ci/package-windows.ps1'
      - 'ci/bundle-adb.ps1'
      - '.github/workflows/windows-portable.yml'

permissions:
  contents: read

concurrency:
  group: wristporter-portable-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-portable:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Build portable app with bundled ADB
        shell: pwsh
        run: ./ci/package-windows.ps1
      - name: Upload portable ZIP and checksum
        uses: actions/upload-artifact@v4
        with:
          name: WristPorter-windows-x64
          path: |
            dist/WristPorter-*-windows-x64.zip
            dist/WristPorter-*-windows-x64.zip.sha256
          retention-days: 5
          if-no-files-found: error
