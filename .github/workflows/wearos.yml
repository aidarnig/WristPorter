name: Wear OS debug shell

on:
  pull_request:
    paths:
      - 'wearos/**'
      - '.github/workflows/wearos.yml'
  push:
    branches: [main]
    paths:
      - 'wearos/**'
      - '.github/workflows/wearos.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wristporter-wearos-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  wearos-debug:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: wearos
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - name: Install pinned Android SDK
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Debug APK, JVM unit tests and Android lint
        run: gradle --no-daemon --stacktrace :app:assembleDebug :app:testDebugUnitTest :app:lintDebug
      - name: Confirm test-only APK exists
        run: test -s app/build/outputs/apk/debug/app-debug.apk
      - name: Upload debug APK (NOT a release)
        uses: actions/upload-artifact@v4
        with:
          name: wristporter-w1a-wearos-debug-apk
          path: wearos/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
